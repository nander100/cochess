[project]
name = "cochess-backend"
version = "0.1.0"
description = "CoChess backend: PGN analysis, detectors, and the Claude coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "chess>=1.11.2",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# backend/alembic/ (the migrations folder) shares the package's name; it's still third-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Autoload is off so globally installed plugins (e.g. ROS via PYTHONPATH) can't break the suite.
addopts = "--disable-plugin-autoload -p pytest_asyncio.plugin -p pytest_cov.plugin --cov=app --cov-report=term-missing"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

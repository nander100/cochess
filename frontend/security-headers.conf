# Included in every location: nginx drops server-level add_header lines in any location that
# sets its own, so all response headers live here.

# Required for SharedArrayBuffer, which multi-threaded Stockfish WASM needs (SPEC §4.1).
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;

# Stockfish compiles WebAssembly ('wasm-unsafe-eval') and runs its threads as workers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # PGNs are small; this is a backstop well above the backend's own 100k-character limit.
    client_max_body_size 1m;

    location /engine/ {
        include /etc/nginx/security-headers.conf;
        types {
            text/javascript js;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # Vite fingerprints these file names, so they can be cached for good.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend sets these itself; hide its copies so they aren't sent twice.
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        # Coach responses are server-sent events: no buffering, and room for long answers.
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

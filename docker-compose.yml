services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/cochess.db
    volumes:
      - cochess-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Put a TLS reverse proxy in front of this in production (see docs/DEPLOY.md).
      - "${COCHESS_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  cochess-data:
